services:
  - type: web
    name: hacksystem-backend
    runtime: node
    rootDir: backend
    plan: starter
    region: oregon
    buildCommand: npm ci || npm install && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ACCESS_TOKEN_TTL
        value: "900"
      - key: REFRESH_TOKEN_TTL
        value: "1209600"
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: hacksystem-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: hacksystem-redis
          type: keyvalue
          property: connectionString
      - key: CORS_ORIGIN
        # coloque aqui a URL pública do frontend do Vercel depois do primeiro deploy
        value: https://SEU-FRONT.vercel.app
    preDeployCommand: |
      npm run prisma:generate && npx prisma migrate deploy

  - type: web
    name: hacksystem-frontend
    runtime: node
    rootDir: frontend
    plan: starter
    region: oregon
    buildCommand: npm ci || npm install && npm run build
    startCommand: npx next start -p $PORT
    autoDeploy: true
    envVars:
      # NÃO vamos usar NEXT_PUBLIC_API_URL; vamos usar proxy de API do Next
      - key: DUMMY
        value: ok

  - type: keyvalue
    name: hacksystem-redis
    plan: free
    region: oregon
    ipAllowList: []

databases:
  - name: hacksystem-db
    plan: free
    region: oregon
